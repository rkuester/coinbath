[package]
name = "coinbath"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Sous vide controller heated by a Bitcoin miner"
default-run = "coinbath"

[[bin]]
name = "coinbath"
path = "src/main.rs"

[[bin]]
name = "coinbath-cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive", "env"] }
i2cdev = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3.4.1", default-features = false, features = ["json"] }

[workspace]
